# @package _global_

defaults:
  - override /data: libero_omnigen2_pair
  - override /model: imagewam_flux2_klein_4b_goal_prior_stage1
  - _self_

data:
  train:
    vision_free: true
    require_text_cache: false
    qwen_text_cache_dir: ???
    qwen_context_len: 512
    qwen_text_cache_format: qwen3_flux2
    pretrained_norm_stats: /data2/JM/Code/ImageWAM/runs/libero_flux2_klein_4b_base_imagewam/2026-08-13_00-24-52/dataset_stats.json

batch_size: 128
num_workers: 8
prefetch_factor: 2
persistent_workers: true

learning_rate: 2.0e-4
warmup_steps: 2000
num_epochs: 1
max_steps: 10000
log_every: 10
save_every: 2000
eval_every: 0
eval_num_samples: 1
keep_latest_state_only: true

gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null
stage1_checkpoint: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: true
  mode: offline
  project: imagewam
  name: libero_flux2_klein_4b_goal_prior_stage1

_target_: imagewam.runtime.create_imagewam_flux2_klein

flux2_src_path: ???
flux2_model_path: ???
ae_model_path: ???
variant: klein-base-4b
qwen3_model_spec: Qwen/Qwen3-4B
qwen_context_len: 512
load_text_encoder: false
proprio_dim: null
mot_checkpoint_mixed_attn: true
mot_gqa_implementation: repeat
mot_force_flash_attention: false
pack_proprio_after_text: true
action_dit_pretrained_path: null

goal_prior_stage: stage1
goal_prior:
  num_goal_tokens: 8
  inner_dim: 512
  # A1. The FLUX text stream's adaLN is driven by the *video* timestep, so
  # training Stage 1 at a fixed t=0 leaves it unprepared for the range Stage 2
  # sweeps. Sampling here removes that mismatch at no cost.
  stage1_sample_video_timestep: true
  # A2. Constant learnable stand-in for the reference image, so Stage 1's text
  # tokens attend something rather than a zero-length stream. 0 disables.
  stage1_null_image_tokens: 32

flux2_lora_config:
  enabled: false
  rank: 16
  alpha: 16.0
  dropout: 0.0
  save_lora_merged: false
  save_trainable_only: false
  target_suffixes:
    - qkv
    - proj
    - linear1
    - linear2
    - img_mlp.0
    - img_mlp.2
    - txt_mlp.0
    - txt_mlp.2

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  num_heads: 24
  attn_head_dim: 128
  num_layers_double: 5
  num_layers_single: 20
  mlp_ratio: 4.0
  max_action_horizon: 64
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 0.5
  lambda_action: 1.0
  lambda_pose: 0.3
